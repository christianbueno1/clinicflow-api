[project]
name = "clinicflow-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Bueno", email = "christianbueno.1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.142.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
]

[project.scripts]
clinicflow-api = "clinicflow_api:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
# B008: Depends(...) en defaults es el patrón idiomático de FastAPI
ignore = ["B008"]

[tool.ruff]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.per-file-ignores]
"src/clinicflow_api/models.py" = ["UP037"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]